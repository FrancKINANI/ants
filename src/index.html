<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ants</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="overlay">
    <!-- Status bar — top center -->
    <div id="status-bar">
      <span id="status-indicator" class="status-dot active"></span>
      <span id="score-label">Score:</span>
      <span id="score-value">100</span>
      <span id="status-text">✅ Focused</span>
    </div>

    <!-- Canvas for ant rendering -->
    <canvas id="ant-canvas"></canvas>

    <!-- Debug / info panel — bottom center -->
    <div id="debug">
      <div id="click-log">Ants active — click on an ant to dismiss it</div>
      <div id="ants-count"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
