[package]
name = "ants"
version = "0.1.0"
description = "Ants - A Cognitive Interruptor for Passive Screen Usage"
authors = ["Ants Team"]
edition = "2021"

[lib]
name = "ants_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
